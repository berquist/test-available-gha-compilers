---
# yamllint disable rule:line-length
name: View available compilers

# yamllint disable-line rule:truthy
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: test-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

permissions: {}

jobs:
  run-bamboo:
    name: View available compilers with ccache
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone this repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - name: ccache
        uses: hendrikmuhs/ccache-action@63069e3931dedbf3b63792097479563182fe70d1 # v1.2
        with:
          create-symlink: true
          key: ${{ matrix.os }}
          verbose: 2
      - name: Check compilers
        run: |
          set -x
          _cleaned_path="$(echo "$PATH" | tr ':' '\n')"
          print_version() {
              if [[ -f "${1}" ]]; then
                  "${1}" --version
              fi
          }

          which -a gcc
          print_version /usr/bin/gcc
          print_version /usr/local/bin/gcc
          which -a clang
          print_version /usr/bin/clang
          print_version /usr/local/bin/clang
# yamllint enable rule:line-length
